# The dev stack. The port binds to 127.0.0.1 only: nothing here should face a network.
services:
  mcp:
    build: .
    env_file: [{ path: .env, required: false }]
    environment:
      HOST: 0.0.0.0        # inside the container; the published port below limits who can reach it
      PORT: "8080"
      # No identity provider in this file: anyone who can reach the port can call the
      # server. docker-compose.idp.yml adds one and turns this off.
      ALLOW_ANONYMOUS: "true"
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
